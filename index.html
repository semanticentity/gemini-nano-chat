<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat with Gemini Nano, the model built into Chrome. Runs fully on your device.">
  <title>Local Gemini Nano Chat</title>

  <!-- Markdown rendering and HTML sanitizing. Pinned versions with integrity
       hashes. If either fails to load, replies show as plain text. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"
          integrity="sha384-rATToyt6602Jnq8c7w8HZwmyOUgPL7mzxX01FBWoV48ns/EgkakGozpES+PnaYOI"
          crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
          integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
          crossorigin="anonymous" defer></script>

  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --border: #e2e2e6;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #0b6bcb;
      --accent-text: #ffffff;
      --ai-bubble: #eef0f3;
      --code-bg: #f3f4f6;
      --pre-bg: #1e1f24;
      --pre-text: #e8e8e8;
      --error: #c0392b;
      --note-bg: #fff8e1;
      --note-text: #6b5800;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171b;
        --panel: #1e1f24;
        --border: #33353c;
        --text: #e8e8ea;
        --muted: #9a9ca3;
        --accent: #4a9eff;
        --accent-text: #0b0c0e;
        --ai-bubble: #2a2c33;
        --code-bg: #2f323a;
        --pre-bg: #111216;
        --pre-text: #e8e8e8;
        --error: #ff7b6b;
        --note-bg: #3a3420;
        --note-text: #f0d98a;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    header { display: flex; align-items: center; gap: 12px; }
    header .titles { flex: 1; min-width: 0; }
    h1 { font-size: 20px; margin: 0; }
    #status { font-size: 13px; color: var(--muted); margin-top: 2px; }
    #status.error { color: var(--error); }

    #chat {
      flex: 1;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; max-width: 360px; line-height: 1.5; }

    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--accent-text);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .msg.ai { align-self: flex-start; background: var(--ai-bubble); border-bottom-left-radius: 4px; }
    .msg.ai.pending { color: var(--muted); font-style: italic; }
    .msg.ai.error { color: var(--error); }
    .msg.note {
      align-self: center;
      background: var(--note-bg);
      color: var(--note-text);
      font-size: 13px;
      max-width: 95%;
    }

    /* Markdown inside AI bubbles */
    .msg.ai > :first-child { margin-top: 0; }
    .msg.ai > :last-child { margin-bottom: 0; }
    .msg.ai p { margin: 0 0 0.6em; }
    .msg.ai ul, .msg.ai ol { margin: 0 0 0.6em; padding-left: 1.4em; }
    .msg.ai li { margin: 0.2em 0; }
    .msg.ai h1, .msg.ai h2, .msg.ai h3, .msg.ai h4 { margin: 0.8em 0 0.4em; line-height: 1.3; }
    .msg.ai h1 { font-size: 1.25em; }
    .msg.ai h2 { font-size: 1.15em; }
    .msg.ai h3, .msg.ai h4 { font-size: 1.05em; }
    .msg.ai a { color: var(--accent); }
    .msg.ai blockquote { margin: 0 0 0.6em; padding-left: 10px; border-left: 3px solid var(--border); color: var(--muted); }
    .msg.ai hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
    .msg.ai code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
    .msg.ai pre {
      position: relative;
      background: var(--pre-bg);
      color: var(--pre-text);
      padding: 12px;
      padding-top: 30px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0 0 0.6em;
    }
    .msg.ai pre code { background: none; padding: 0; font-size: 13px; color: inherit; }
    .msg.ai table { border-collapse: collapse; margin: 0 0 0.6em; font-size: 0.95em; display: block; overflow-x: auto; }
    .msg.ai th, .msg.ai td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #555;
      background: transparent;
      color: #ccc;
      cursor: pointer;
    }
    .copy-btn:hover { color: #fff; border-color: #888; }

    .composer { display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1;
      resize: none;
      font: inherit;
      font-size: 16px;
      line-height: 1.4;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      color: var(--text);
      outline: none;
      max-height: 200px;
    }
    textarea:focus { border-color: var(--accent); }
    button { font: inherit; cursor: pointer; }
    .primary {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background: var(--accent);
      color: var(--accent-text);
    }
    .primary.stop { background: var(--muted); }
    .secondary {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
    }
    .hint { font-size: 12px; color: var(--muted); text-align: center; }

    /* Toast: short message with an optional action, like Undo */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100% - 32px);
      padding: 10px 10px 10px 16px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }
    .toast[hidden] { display: none; }
    .toast button {
      border: none;
      background: transparent;
      color: inherit;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .toast #toast-action { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .toast button:hover { background: rgba(127, 127, 127, 0.25); }
    .toast #toast-close { font-size: 18px; line-height: 1; opacity: 0.7; }

    /* Onboarding card */
    .card {
      align-self: stretch;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .card.warn { border-left-color: var(--error); }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 0 0 8px; }
    .card ol { margin: 0 0 8px; padding-left: 1.3em; }
    .card li { margin: 8px 0; }
    .card .chip { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .card .chip code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      background: var(--code-bg);
      padding: 3px 6px;
      border-radius: 4px;
      overflow-wrap: anywhere;
    }
    .card .chip button { padding: 2px 10px; font-size: 12px; }
    .card .small { font-size: 12.5px; color: var(--muted); }
    .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .card .actions .primary { font-size: 14px; padding: 7px 16px; }
    .card button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="titles">
        <h1>Local Gemini Nano Chat</h1>
        <div id="status" role="status">Runs on your device. The model loads on your first message.</div>
      </div>
      <button id="new-chat" class="secondary" type="button">New chat</button>
    </header>

    <main id="chat" aria-live="polite">
      <div class="empty" id="empty">
        Ask anything. Replies come from Gemini Nano running inside Chrome, so nothing leaves your machine. Your chat is saved in this browser until you start a new one.
      </div>
    </main>

    <div class="composer">
      <label for="prompt" class="visually-hidden" style="position:absolute;left:-9999px">Message</label>
      <textarea id="prompt" rows="1" placeholder="Ask something..." autocomplete="off" autofocus></textarea>
      <button id="send" class="primary" type="button">Send</button>
    </div>
    <div class="hint">Enter to send. Shift+Enter for a new line.</div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button id="toast-action" type="button" hidden></button>
      <button id="toast-close" type="button" aria-label="Dismiss">&times;</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const empty = document.getElementById('empty');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const newChatBtn = document.getElementById('new-chat');
    const statusEl = document.getElementById('status');

    // ---------- Toast ----------

    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const toastAction = document.getElementById('toast-action');
    let toastTimer = null;

    function hideToast() {
      toast.hidden = true;
      clearTimeout(toastTimer);
    }

    // showToast('Saved.') or showToast('Chat cleared.', { label: 'Undo', onClick })
    function showToast(text, action, ms = 8000) {
      toastText.textContent = text;
      toastAction.hidden = !action;
      toastAction.textContent = action ? action.label : '';
      toastAction.onclick = action ? () => { hideToast(); action.onClick(); } : null;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, ms);
    }

    document.getElementById('toast-close').addEventListener('click', hideToast);
    // Keep the toast up while the mouse is on it, so Undo doesn't vanish mid-reach.
    toast.addEventListener('mouseenter', () => clearTimeout(toastTimer));
    toast.addEventListener('mouseleave', () => { toastTimer = setTimeout(hideToast, 3000); });

    // Small models guess about themselves, so state the facts plainly.
    const SYSTEM_PROMPT = [
      'You are a helpful assistant inside a chat page called Local Gemini Nano Chat.',
      'Facts about you: you are Gemini Nano, the AI model built into Google Chrome.',
      'You run entirely on the user\'s own computer, inside their browser.',
      'You are not hosted on any server, and nothing the user types leaves their device.',
      'You have no internet access, so you cannot look things up or see live information.',
      'Your knowledge comes from training and may be out of date.',
      'If you are not sure of a fact, say so instead of guessing.',
      `Today's date is ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`,
      'Keep answers clear and reasonably short. Use Markdown when it helps readability.',
    ].join(' ');

    let session = null;
    let loading = null;
    let controller = null; // AbortController for the reply in progress

    // ---------- Saved chat ----------
    // Stored in this browser only. github.io pages share one origin,
    // so the key is namespaced.

    const STORE_KEY = 'gemini-nano-chat:history:v1';
    const MAX_STORED = 100; // messages kept in storage
    const MAX_CONTEXT = 20; // messages fed back to the model on load
    let history = loadHistory();

    function loadHistory() {
      try {
        const arr = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
        if (!Array.isArray(arr)) return [];
        return arr.filter((m) => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        if (history.length) localStorage.setItem(STORE_KEY, JSON.stringify(history.slice(-MAX_STORED)));
        else localStorage.removeItem(STORE_KEY);
      } catch {
        // Storage can be full or blocked. The chat still works without it.
      }
    }

    // Recent turns for the model, starting on a user message.
    function recentTurns(limit) {
      if (limit <= 0) return []; // slice(-0) would return everything
      const recent = history.slice(-limit);
      while (recent.length && recent[0].role !== 'user') recent.shift();
      return recent;
    }

    // ---------- Status ----------

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', isError);
    }

    function showContextUsage() {
      if (!session) return;
      // Newer Chrome: contextUsage/contextWindow. Older: inputUsage/inputQuota.
      const used = session.contextUsage ?? session.inputUsage;
      const max = session.contextWindow ?? session.inputQuota;
      if (typeof used === 'number' && typeof max === 'number' && max > 0) {
        const pct = Math.round((used / max) * 100);
        setStatus(`Ready. Context used: ${pct}% (${used} of ${max} tokens).`);
      }
    }

    // ---------- Rendering ----------

    let purifyHooked = false;

    function renderMarkdown(el, text) {
      const canRender = window.marked && window.DOMPurify;
      if (!canRender) {
        el.style.whiteSpace = 'pre-wrap';
        el.textContent = text;
        return;
      }
      if (!purifyHooked) {
        // Make every link open in a new tab, safely.
        DOMPurify.addHook('afterSanitizeAttributes', (node) => {
          if (node.tagName === 'A') {
            node.setAttribute('target', '_blank');
            node.setAttribute('rel', 'noopener noreferrer');
          }
        });
        purifyHooked = true;
      }
      const html = marked.parse(text, { gfm: true, breaks: true });
      // Block images and embeds. Models invent URLs, which would show broken
      // images and make the browser contact outside servers. Links stay,
      // since they only load if the person clicks them.
      el.innerHTML = DOMPurify.sanitize(html, {
        FORBID_TAGS: ['img', 'picture', 'source', 'video', 'audio', 'iframe', 'object', 'embed', 'style', 'form', 'input', 'button', 'textarea', 'select'],
        FORBID_ATTR: ['style'],
      });
      addCopyButtons(el);
    }

    function addCopyButtons(el) {
      el.querySelectorAll('pre').forEach((pre) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          const code = pre.querySelector('code')?.innerText ?? pre.innerText;
          try {
            await navigator.clipboard.writeText(code);
            btn.textContent = 'Copied';
          } catch {
            btn.textContent = 'Copy failed';
          }
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        });
        pre.appendChild(btn);
      });
    }

    function addMessage(kind, text = '') {
      empty.hidden = true;
      const div = document.createElement('div');
      div.className = `msg ${kind}`;
      div.textContent = text;
      chat.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // ---------- Model ----------

    function getSession() {
      if (session) return Promise.resolve(session);
      if (loading) return loading;

      const start = Date.now();
      const tick = setInterval(() => {
        setStatus(`Loading model... ${Math.round((Date.now() - start) / 1000)}s`);
      }, 1000);
      setStatus('Loading model...');

      const monitor = (m) => {
        m.addEventListener('downloadprogress', (e) => {
          setStatus(`Downloading model: ${Math.round(e.loaded * 100)}%`);
        });
      };

      // Chrome with speculative decoding (MTP) requires 'most-predictable'.
      // Other Chromes may not accept samplingMode, so retry without it.
      const createWith = (turns) => {
        const base = { initialPrompts: [{ role: 'system', content: SYSTEM_PROMPT }, ...turns], monitor };
        return LanguageModel.create({ ...base, samplingMode: 'most-predictable' }).catch((err) => {
          if (err.name === 'QuotaExceededError') throw err;
          console.warn('[nano] create with samplingMode failed, retrying without it:', err);
          return LanguageModel.create(base);
        });
      };

      // Feed the saved chat back in so follow-up questions still work.
      // If it's too long for the model, try fewer messages, then none.
      const createFitting = async () => {
        const limits = [MAX_CONTEXT, 4, 0];
        for (let i = 0; i < limits.length; i++) {
          const turns = recentTurns(limits[i]);
          try {
            return await createWith(turns);
          } catch (err) {
            const last = i === limits.length - 1 || !turns.length;
            if (err.name !== 'QuotaExceededError' || last) throw err;
            console.warn(`[nano] saved chat too long for the model, trying ${limits[i + 1]} messages`);
          }
        }
      };
      loading = createFitting()
        .then((s) => {
          session = s;
          clearOnboarding();
          s.addEventListener?.('contextoverflow', () => {
            addMessage('note', 'This chat is long, so the oldest messages are being dropped from the model\'s memory. Start a new chat for a clean slate.');
          });
          setStatus(`Ready. Loaded in ${Math.round((Date.now() - start) / 1000)}s.`);
          return s;
        })
        .finally(() => {
          clearInterval(tick);
          loading = null;
        });
      return loading;
    }

    // ---------- Sending ----------

    function setBusy(isBusy) {
      sendBtn.textContent = isBusy ? 'Stop' : 'Send';
      sendBtn.classList.toggle('stop', isBusy);
    }

    async function handleSend() {
      // While a reply is in progress, the button stops it.
      if (controller) { controller.abort(); return; }

      const text = promptEl.value.trim();
      if (!text) { promptEl.focus(); return; }

      if (!('LanguageModel' in window)) {
        addMessage('ai error', 'This browser does not support Chrome\'s built-in AI. Use desktop Chrome 148 or later.');
        return;
      }

      // Start loading right away, while the click still counts as a user gesture.
      const sessionReady = getSession();

      // Sending ends any Undo window, so Undo can't wipe this new message.
      hideToast();
      addMessage('user', text);
      promptEl.value = '';
      autosize();

      const bubble = addMessage('ai pending', session ? 'Thinking...' : 'Loading the model, then thinking...');
      controller = new AbortController();
      setBusy(true);

      try {
        const s = await sessionReady;
        bubble.textContent = 'Thinking...';
        const reply = await s.prompt(text, { signal: controller.signal });
        bubble.classList.remove('pending');
        renderMarkdown(bubble, reply || '_(no response)_');
        if (reply) {
          history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
          saveHistory();
        }
        showContextUsage();
      } catch (err) {
        bubble.classList.remove('pending');
        if (err.name === 'AbortError') {
          bubble.textContent = 'Stopped.';
          bubble.classList.add('pending');
        } else if (err.name === 'QuotaExceededError') {
          bubble.classList.add('error');
          bubble.textContent = 'That message is too long for the model\'s memory. Try a shorter message or start a new chat.';
        } else {
          console.error('[nano]', err);
          bubble.classList.add('error');
          bubble.textContent = `Error: ${err.name}: ${err.message}`;
          if (!session) setStatus('The model failed to load. Send again to retry.', true);
        }
      } finally {
        controller = null;
        setBusy(false);
        scrollToBottom();
        promptEl.focus();
      }
    }

    // Clear right away, then offer Undo instead of asking "are you sure?"
    function newChat() {
      const saved = history.slice();
      if (controller) controller.abort();
      if (saved.length) {
        showToast('Chat cleared.', { label: 'Undo', onClick: () => undoNewChat(saved) });
      }
      history = [];
      saveHistory();
      const wasLoaded = !!session;
      if (session) { session.destroy(); session = null; }
      chat.querySelectorAll('.msg').forEach((m) => m.remove());
      empty.hidden = !!onboardCard;
      promptEl.focus();
      if (wasLoaded) {
        // The model is on disk, so reload it right away without a click.
        getSession().catch(() => setStatus('The model failed to load. Send a message to retry.', true));
      } else {
        setStatus('New chat.');
      }
    }

    function undoNewChat(saved) {
      history = saved;
      saveHistory();
      chat.querySelectorAll('.msg').forEach((m) => m.remove());
      restoreHistory();
      setStatus('Chat restored.');
      // If the model was reloaded empty, wait for that, then reload it
      // with the restored chat so it remembers the conversation.
      if (session || loading) {
        Promise.resolve(loading)
          .catch(() => {})
          .then(() => {
            if (session) { session.destroy(); session = null; }
            return getSession();
          })
          .catch(() => setStatus('The model failed to load. Send a message to retry.', true));
      }
    }

    // ---------- Input ----------

    function autosize() {
      promptEl.style.height = 'auto';
      promptEl.style.height = `${Math.min(promptEl.scrollHeight, 200)}px`;
    }

    promptEl.addEventListener('input', autosize);
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });
    sendBtn.addEventListener('click', handleSend);
    newChatBtn.addEventListener('click', newChat);

    // ---------- Onboarding ----------
    // A web page can't read chrome://flags. So this checks the symptoms
    // (missing API, model state, Chrome not answering) and shows the fix.

    const URLS = {
      promptFlag: 'chrome://flags/#prompt-api-for-gemini-nano',
      modelFlag: 'chrome://flags/#optimization-guide-on-device-model',
      internals: 'chrome://on-device-internals',
      update: 'chrome://settings/help',
    };
    const MIN_CHROME = 148;
    let onboardCard = null;

    function detectBrowser() {
      const uad = navigator.userAgentData;
      const ua = navigator.userAgent;
      let chrome = null;
      if (uad && Array.isArray(uad.brands)) {
        const g = uad.brands.find((b) => b.brand === 'Google Chrome');
        if (g) chrome = parseInt(g.version, 10);
      } else {
        const m = ua.match(/Chrome\/(\d+)/);
        if (m && !/Edg\/|OPR\//.test(ua)) chrome = parseInt(m[1], 10);
      }
      const mobile = uad ? !!uad.mobile : /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
      let framed = false;
      try { framed = window.self !== window.top; } catch { framed = true; }
      return { chrome, mobile, framed };
    }

    function clearOnboarding() {
      if (onboardCard) { onboardCard.remove(); onboardCard = null; }
    }

    // chrome:// links can't be opened from a web page, so show a copy chip.
    function urlChip(url) {
      const wrap = document.createElement('span');
      wrap.className = 'chip';
      const code = document.createElement('code');
      code.textContent = url;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'secondary';
      btn.textContent = 'Copy';
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(url);
          btn.textContent = 'Copied';
        } catch {
          btn.textContent = 'Copy failed, select it';
        }
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      });
      wrap.append(code, btn);
      return wrap;
    }

    function showCard({ state, title, intro, steps = [], note, actions = [], warn = false }) {
      clearOnboarding();
      const card = document.createElement('section');
      card.className = `card${warn ? ' warn' : ''}`;
      card.dataset.state = state;

      const h = document.createElement('h3');
      h.textContent = title;
      card.appendChild(h);

      if (intro) {
        const p = document.createElement('p');
        p.textContent = intro;
        card.appendChild(p);
      }

      if (steps.length) {
        const ol = document.createElement('ol');
        steps.forEach(({ text, url }) => {
          const li = document.createElement('li');
          li.textContent = text;
          if (url) li.appendChild(urlChip(url));
          ol.appendChild(li);
        });
        card.appendChild(ol);
        if (steps.some((s) => s.url)) {
          const p = document.createElement('p');
          p.className = 'small';
          p.textContent = 'Chrome blocks links to its own settings pages. Copy each address and paste it into the address bar.';
          card.appendChild(p);
        }
      }

      if (note) {
        const p = document.createElement('p');
        p.className = 'small';
        p.textContent = note;
        card.appendChild(p);
      }

      if (actions.length) {
        const row = document.createElement('div');
        row.className = 'actions';
        actions.forEach(({ label, primary, onClick }) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = primary ? 'primary' : 'secondary';
          b.textContent = label;
          b.addEventListener('click', () => onClick(b));
          row.appendChild(b);
        });
        card.appendChild(row);
      }

      chat.prepend(card);
      empty.hidden = true;
      onboardCard = card;
      return card;
    }

    function timeout(promise, ms) {
      return Promise.race([promise, new Promise((r) => setTimeout(() => r('timeout'), ms))]);
    }

    // Ask with and without samplingMode, since some Chromes require it and
    // others reject it. Keep the most hopeful answer.
    async function checkAvailability() {
      const rank = { available: 4, downloading: 3, downloadable: 2, unavailable: 1, timeout: 0 };
      const results = await Promise.all(
        [{ samplingMode: 'most-predictable' }, {}].map((opts) =>
          timeout(Promise.resolve().then(() => LanguageModel.availability(opts)), 8000)
            .catch((err) => { console.warn('[nano] availability failed:', err); return null; })
        )
      );
      console.log('[nano] availability:', results);
      const known = results.filter((r) => typeof r === 'string' && r in rank);
      if (!known.length) return 'error';
      return known.sort((a, b) => rank[b] - rank[a])[0];
    }

    function startDownload(btn) {
      btn.disabled = true;
      btn.textContent = 'Starting...';
      getSession()
        .then(() => addMessage('note', 'Gemini Nano is ready. Ask anything.'))
        .catch((err) => {
          console.error('[nano]', err);
          btn.disabled = false;
          btn.textContent = 'Try again';
          setStatus(`Download failed: ${err.name}: ${err.message}`, true);
        });
    }

    function showMissingApiCard(env) {
      if (env.mobile) {
        return showCard({
          state: 'mobile', warn: true,
          title: 'Phones are not supported yet',
          intro: 'Gemini Nano runs in Chrome on Windows, Mac, Linux, and Chromebook Plus. Open this page on a computer.',
        });
      }
      if (!env.chrome) {
        return showCard({
          state: 'not-chrome', warn: true,
          title: 'This needs Google Chrome',
          intro: `Gemini Nano is built into desktop Google Chrome. Open this page in Chrome ${MIN_CHROME} or later.`,
        });
      }
      if (env.chrome < MIN_CHROME) {
        return showCard({
          state: 'old-chrome',
          title: 'Update Chrome to use this',
          intro: `You have Chrome ${env.chrome}. Built-in AI is on by default from Chrome ${MIN_CHROME}.`,
          steps: [
            { text: 'Update Chrome here, then relaunch it:', url: URLS.update },
            { text: 'Or, without updating, set this flag to Enabled:', url: URLS.promptFlag },
            { text: 'And set this one to Enabled too, then relaunch Chrome:', url: URLS.modelFlag },
          ],
        });
      }
      return showCard({
        state: 'api-off',
        title: 'Built-in AI is turned off in this Chrome',
        intro: 'Your Chrome is new enough, but the feature is switched off.',
        steps: [
          { text: 'Set this flag to Enabled:', url: URLS.promptFlag },
          { text: 'Set this flag to Enabled:', url: URLS.modelFlag },
          { text: 'Relaunch Chrome, then reload this page.' },
        ],
        note: 'If a work or school account manages this Chrome, an admin may have turned it off.',
      });
    }

    async function runOnboarding() {
      clearOnboarding();
      const env = detectBrowser();

      if (env.framed) {
        setStatus('Open this page in its own tab.', true);
        showCard({
          state: 'framed', warn: true,
          title: 'Open this page in its own tab',
          intro: 'Chrome blocks built-in AI inside embedded previews.',
          actions: [{ label: 'Open in new tab', primary: true, onClick: () => window.open(location.href, '_blank', 'noopener') }],
        });
        return;
      }

      if (!('LanguageModel' in window)) {
        setStatus('Built-in AI is not available in this browser.', true);
        showMissingApiCard(env);
        return;
      }

      setStatus('Checking whether Gemini Nano is ready...');
      const state = await checkAvailability();

      if (state === 'available') {
        // Already on disk: load it now so the first reply is fast.
        getSession().catch((err) => {
          console.error('[nano]', err);
          setStatus('The model failed to load.', true);
          showCard({
            state: 'load-failed', warn: true,
            title: 'The model did not load',
            intro: `${err.name}: ${err.message}`,
            steps: [{ text: 'Check the Model Status tab here:', url: URLS.internals }],
            actions: [{ label: 'Try again', primary: true, onClick: () => runOnboarding() }],
          });
        });
      } else if (state === 'downloadable') {
        setStatus('One-time setup needed.');
        showCard({
          state,
          title: 'One-time setup: download Gemini Nano',
          intro: 'The model downloads once, then runs offline on this device. It is a few GB, so use Wi-Fi or another unmetered connection. Chrome needs about 22 GB of free disk space.',
          actions: [{ label: 'Download now', primary: true, onClick: startDownload }],
          note: 'Or just send a message. The download starts then.',
        });
      } else if (state === 'downloading') {
        setStatus('Gemini Nano is downloading.');
        showCard({
          state,
          title: 'Gemini Nano is downloading',
          intro: 'Chrome is already fetching the model in the background.',
          actions: [{ label: 'Show progress', primary: true, onClick: startDownload }],
        });
      } else if (state === 'unavailable') {
        setStatus('This device cannot run Gemini Nano.', true);
        showCard({
          state, warn: true,
          title: 'This device can\'t run Gemini Nano',
          intro: 'Chrome needs a GPU with more than 4 GB of memory, or 16 GB of RAM and 4 CPU cores. It also needs 22 GB of free disk space.',
          steps: [
            { text: 'See exactly what Chrome reports:', url: URLS.internals },
            { text: 'To try anyway, set this flag to "Enabled BypassPerfRequirement" if that option is listed, then relaunch Chrome:', url: URLS.modelFlag },
          ],
        });
      } else {
        const failed = state === 'error';
        setStatus(failed ? 'Chrome could not check the model.' : 'Chrome has not answered yet.', failed);
        showCard({
          state: failed ? 'check-failed' : 'stalled',
          title: failed ? 'Chrome could not check the model' : 'Chrome is slow to answer',
          intro: failed
            ? 'Chrome returned an error when asked about the model. The console has details.'
            : 'Chrome has not said whether the model is ready. It may still be setting up in the background.',
          steps: [
            { text: 'Send a message to try anyway.' },
            { text: 'Or check the Model Status tab here:', url: URLS.internals },
          ],
          actions: [{ label: 'Check again', primary: true, onClick: () => runOnboarding() }],
        });
      }
    }

    // Show the saved chat. Waits for DOMContentLoaded, because the Markdown
    // libraries load with defer and run after this script.
    function restoreHistory() {
      history.forEach((m) => {
        if (m.role === 'user') addMessage('user', m.content);
        else renderMarkdown(addMessage('ai'), m.content);
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', restoreHistory);
    } else {
      restoreHistory();
    }

    runOnboarding();
  </script>
</body>
</html>
